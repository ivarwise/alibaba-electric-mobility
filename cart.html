<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart – Alibaba</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ali: { orange: '#FF6A00', dark: '#E55A00' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0); }
  </style>
</head>

<body class="bg-[#f5f5f5] text-slate-800 antialiased pb-24 lg:pb-0">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="javascript:history.back()" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center">
        <i class="fa-solid fa-arrow-left text-slate-600"></i>
      </a>
      <h1 class="font-bold text-slate-900">Cart</h1>
      <span id="cart-count-label" class="text-sm text-slate-500"></span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-5">

    <!-- Empty state -->
    <div id="empty-cart" class="hidden py-20 text-center">
      <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-cart-shopping text-3xl text-slate-300"></i>
      </div>
      <p class="font-semibold text-slate-700 mb-1">Your cart is empty</p>
      <p class="text-sm text-slate-500 mb-5">Browse products and add items to your cart</p>
      <a href="shop.html" class="inline-block bg-ali-orange hover:bg-ali-dark text-white font-bold px-6 py-3 rounded-xl transition">
        Continue Shopping
      </a>
    </div>

    <!-- Cart items -->
    <div id="cart-content" class="hidden space-y-4">
      <div id="cart-items" class="space-y-3"></div>

      <!-- Summary -->
      <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
        <h2 class="font-bold text-slate-900 mb-3">Order Summary</h2>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between">
            <span class="text-slate-500">Items</span>
            <span id="summary-items" class="font-medium">0</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-500">Subtotal</span>
            <span id="summary-subtotal" class="font-medium">$0</span>
          </div>
          <div class="border-t border-slate-100 pt-2 flex justify-between">
            <span class="font-bold text-slate-900">Estimated Total</span>
            <span id="summary-total" class="font-black text-ali-orange text-lg">$0</span>
          </div>
        </div>
        <p class="text-[11px] text-slate-400 mt-3">
          Final price confirmed after quotation. Payment is manual — we will send bank details.
        </p>
      </div>

      <!-- Actions -->
      <div class="space-y-2">
        <button id="checkout-btn"
                class="w-full bg-ali-orange hover:bg-ali-dark text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-500/20">
          Proceed to Order
        </button>
        <a href="shop.html" class="block w-full text-center border border-slate-200 text-slate-700 font-semibold py-3 rounded-xl hover:bg-white transition">
          Continue Shopping
        </a>
      </div>
    </div>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="bottom-nav lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50">
    <div class="flex items-center justify-around h-14">
      <a href="index.html" class="flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px]">Home</span>
      </a>
      <a href="shop.html" class="flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-grid-2 text-lg"></i>
        <span class="text-[10px]">Categories</span>
      </a>
      <a href="cart.html" class="flex flex-col items-center gap-0.5 text-ali-orange relative">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span class="text-[10px] font-semibold">Cart</span>
        <span id="nav-cart-badge" class="absolute top-0 right-1/4 min-w-[14px] h-3.5 bg-red-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center px-0.5 hidden">0</span>
      </a>
      <a href="orders.html" class="flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-clipboard-list text-lg"></i>
        <span class="text-[10px]">Orders</span>
      </a>
      <a href="account.html" class="flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-regular fa-user text-lg"></i>
        <span class="text-[10px]">Account</span>
      </a>
    </div>
  </nav>

  <script>
    function getCart() {
      try { return JSON.parse(localStorage.getItem('ali_cart') || '[]'); } catch { return []; }
    }
    function saveCart(cart) {
      localStorage.setItem('ali_cart', JSON.stringify(cart));
    }

    function formatMoney(n) {
      return '$' + Number(n || 0).toLocaleString();
    }

    function renderCart() {
      const cart = getCart();
      const empty = document.getElementById('empty-cart');
      const content = document.getElementById('cart-content');
      const itemsEl = document.getElementById('cart-items');

      // Badge
      const totalQty = cart.reduce((s, i) => s + (i.qty || 1), 0);
      document.getElementById('cart-count-label').textContent = totalQty ? `(${totalQty})` : '';
      const navBadge = document.getElementById('nav-cart-badge');
      if (totalQty > 0) {
        navBadge.textContent = totalQty > 99 ? '99+' : totalQty;
        navBadge.classList.remove('hidden');
      } else {
        navBadge.classList.add('hidden');
      }

      if (!cart.length) {
        empty.classList.remove('hidden');
        content.classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      content.classList.remove('hidden');

      let subtotal = 0;

      itemsEl.innerHTML = cart.map((item, index) => {
        const line = (item.price || 0) * (item.qty || 1);
        subtotal += line;
        const img = item.image || 'https://placehold.co/80x80?text=No';

        return `
          <div class="bg-white rounded-xl border border-slate-100 p-3 flex gap-3 shadow-sm">
            <a href="product.html?id=${item.id}" class="w-20 h-20 rounded-lg bg-slate-50 overflow-hidden flex-shrink-0">
              <img src="${img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/80x80?text=No'">
            </a>
            <div class="flex-1 min-w-0">
              <a href="product.html?id=${item.id}" class="font-semibold text-sm text-slate-900 line-clamp-2 hover:text-ali-orange transition">
                ${item.title || 'Product'}
              </a>
              <p class="text-ali-orange font-bold text-sm mt-0.5">${formatMoney(item.price)}</p>
              <p class="text-[11px] text-slate-400">MOQ: ${item.moq || 1}</p>

              <div class="flex items-center justify-between mt-2">
                <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden">
                  <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-50">−</button>
                  <span class="w-10 text-center text-sm font-semibold">${item.qty || 1}</span>
                  <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-50">+</button>
                </div>
                <button onclick="removeItem(${index})" class="text-xs text-red-500 font-medium hover:underline">
                  Remove
                </button>
              </div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('summary-items').textContent = totalQty;
      document.getElementById('summary-subtotal').textContent = formatMoney(subtotal);
      document.getElementById('summary-total').textContent = formatMoney(subtotal);
    }

    window.changeQty = function(index, delta) {
      const cart = getCart();
      if (!cart[index]) return;
      const moq = cart[index].moq || 1;
      let qty = (cart[index].qty || 1) + delta;
      if (qty < moq) qty = moq;
      if (qty < 1) qty = 1;
      cart[index].qty = qty;
      saveCart(cart);
      renderCart();
    };

    window.removeItem = function(index) {
      const cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCart();
    };

    document.getElementById('checkout-btn').addEventListener('click', () => {
      const cart = getCart();
      if (!cart.length) return;

      // If single item → go to place-order for that product
      if (cart.length === 1) {
        window.location.href = `place-order.html?product=${cart[0].id}&qty=${cart[0].qty || 1}`;
        return;
      }

      // Multiple items: store cart for order page and go to first product order
      // (Simple approach: order first item, or you can build multi-item checkout later)
      localStorage.setItem('ali_checkout_cart', JSON.stringify(cart));
      window.location.href = `place-order.html?product=${cart[0].id}&qty=${cart[0].qty || 1}`;
    });

    renderCart();
  </script>
</body>
</html>
