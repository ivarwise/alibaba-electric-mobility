<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier – EVSource</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF6A00',
              dark: '#E55A00',
              navy: '#0F172A'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- TOP BAR -->
  <div class="bg-slate-900 text-slate-300 text-[11px] py-1.5">
    <div class="max-w-6xl mx-auto px-4 flex justify-between">
      <span>Global Electric Mobility Trade</span>
      <a href="index.html" class="hover:text-white">Home</a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="javascript:history.back()" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center lg:hidden">
        <i class="fa-solid fa-arrow-left text-slate-600"></i>
      </a>
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <div class="w-8 h-8 rounded-lg bg-brand-orange flex items-center justify-center text-white font-black text-sm">EV</div>
        <span class="font-black text-slate-900 hidden sm:inline">EVSource</span>
      </a>
      <div class="flex-1"></div>
      <a href="shop.html" class="text-sm text-slate-600 hover:text-brand-orange hidden sm:inline">Shop</a>
      <a href="index.html" class="text-sm text-slate-600 hover:text-brand-orange ml-4 hidden sm:inline">Home</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <div id="loading" class="py-20 text-center text-slate-400">
      <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
      <p>Loading supplier...</p>
    </div>

    <div id="not-found" class="hidden py-20 text-center">
      <i class="fa-solid fa-building text-4xl text-slate-300 mb-3"></i>
      <p class="font-semibold text-slate-700">Supplier not found</p>
      <a href="index.html" class="inline-block mt-4 text-sm font-bold text-brand-orange hover:underline">Back to home →</a>
    </div>

    <div id="content" class="hidden">

      <!-- Supplier header card -->
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 sm:p-6 mb-6">
        <div class="flex flex-col sm:flex-row gap-5">
          <div id="logo-box" class="w-20 h-20 rounded-2xl bg-slate-100 flex items-center justify-center flex-shrink-0 overflow-hidden mx-auto sm:mx-0">
            <span class="font-black text-slate-400 text-2xl" id="logo-initial">S</span>
          </div>
          <div class="flex-1 text-center sm:text-left">
            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 mb-1">
              <h1 id="company-name" class="text-xl sm:text-2xl font-black text-slate-900">—</h1>
              <span id="badges"></span>
            </div>
            <p id="meta" class="text-sm text-slate-500 mb-3">—</p>
            <p id="description" class="text-sm text-slate-600 leading-relaxed max-w-2xl"></p>
            <div id="main-products" class="flex flex-wrap gap-2 mt-3 justify-center sm:justify-start"></div>
          </div>
        </div>
      </div>

      <!-- Stats row -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <div class="bg-white rounded-xl border border-slate-100 p-4 text-center">
          <p class="text-xl font-black text-slate-900" id="stat-products">—</p>
          <p class="text-[11px] text-slate-500">Products</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-100 p-4 text-center">
          <p class="text-xl font-black text-slate-900" id="stat-years">—</p>
          <p class="text-[11px] text-slate-500">Years</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-100 p-4 text-center">
          <p class="text-xl font-black text-slate-900" id="stat-country">—</p>
          <p class="text-[11px] text-slate-500">Country</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-100 p-4 text-center">
          <p class="text-xl font-black text-emerald-600" id="stat-status">Active</p>
          <p class="text-[11px] text-slate-500">Status</p>
        </div>
      </div>

      <!-- Products -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-slate-900">Products from this supplier</h2>
        <a href="shop.html" class="text-sm font-semibold text-brand-orange hover:underline">All products →</a>
      </div>

      <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
        <div class="bg-white rounded-xl border border-slate-100 h-56 skeleton"></div>
        <div class="bg-white rounded-xl border border-slate-100 h-56 skeleton"></div>
        <div class="bg-white rounded-xl border border-slate-100 h-56 skeleton hidden sm:block"></div>
        <div class="bg-white rounded-xl border border-slate-100 h-56 skeleton hidden lg:block"></div>
      </div>

      <div id="no-products" class="hidden py-12 text-center bg-white rounded-xl border border-dashed border-slate-200">
        <i class="fa-solid fa-box-open text-2xl text-slate-300 mb-2"></i>
        <p class="text-sm text-slate-500">No published products yet</p>
      </div>

    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center text-xs">
      © 2026 EVSource · Electric Mobility B2B Marketplace
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://zgbdhpebmjokbaeflqhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const supplierId = new URLSearchParams(window.location.search).get('id');

    function formatPrice(min, max, currency = 'USD') {
      if (min == null && max == null) return 'Contact';
      const s = currency === 'USD' ? '$' : currency + ' ';
      if (min != null && max != null && min !== max) {
        return `${s}${Number(min).toLocaleString()} – ${s}${Number(max).toLocaleString()}`;
      }
      return `${s}${Number(min || max).toLocaleString()}`;
    }

    function productCard(p) {
      const img = p.main_image_url || (p.images && p.images[0]) || 'https://placehold.co/400x300?text=No+Image';
      const badges = [];
      if (p.is_top_seller) badges.push('<span class="bg-amber-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">Top Seller</span>');
      if (p.is_hot) badges.push('<span class="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">Hot</span>');
      if (p.is_best_price) badges.push('<span class="bg-emerald-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">Best Price</span>');

      return `
        <a href="product.html?id=${p.id}" class="bg-white rounded-xl border border-slate-100 overflow-hidden hover:shadow-md transition group block">
          <div class="relative aspect-[4/3] bg-slate-50 overflow-hidden">
            <img src="${img}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                 onerror="this.src='https://placehold.co/400x300?text=No+Image'">
            ${badges.length ? `<div class="absolute top-2 left-2 flex flex-wrap gap-1">${badges.join('')}</div>` : ''}
          </div>
          <div class="p-3">
            <h3 class="text-sm font-semibold text-slate-900 line-clamp-2 min-h-[40px] mb-1 group-hover:text-brand-orange transition">${p.title}</h3>
            <p class="text-brand-orange font-bold text-sm">${formatPrice(p.price_min, p.price_max, p.currency)}</p>
            <p class="text-[11px] text-slate-500 mt-0.5">MOQ: ${p.moq || 1}</p>
          </div>
        </a>`;
    }

    async function loadSupplier() {
      if (!supplierId) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('not-found').classList.remove('hidden');
        return;
      }

      try {
        const { data: s, error } = await supabaseClient
          .from('suppliers')
          .select('*')
          .eq('id', supplierId)
          .eq('is_active', true)
          .single();

        if (error || !s) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('not-found').classList.remove('hidden');
          return;
        }

        document.title = s.company_name + ' – EVSource';
        document.getElementById('company-name').textContent = s.company_name;
        document.getElementById('logo-initial').textContent = (s.company_name || 'S')[0];
        document.getElementById('description').textContent = s.description || '';
        document.getElementById('meta').textContent = [s.city, s.country].filter(Boolean).join(', ') || '—';
        document.getElementById('stat-years').textContent = s.years_in_business || '—';
        document.getElementById('stat-country').textContent = s.country || '—';
        document.getElementById('stat-status').textContent = s.is_active ? 'Active' : 'Inactive';

        if (s.logo_url) {
          document.getElementById('logo-box').innerHTML =
            `<img src="${s.logo_url}" class="w-full h-full object-cover" alt="${s.company_name}">`;
        }

        // Badges
        let badgeHTML = '';
        if (s.is_gold || s.badge === 'gold') {
          badgeHTML += '<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded">Gold Supplier</span>';
        } else if (s.is_verified || s.badge === 'verified') {
          badgeHTML += '<span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded">Verified</span>';
        }
        if (s.badge === 'premium') {
          badgeHTML += '<span class="bg-violet-100 text-violet-700 text-[10px] font-bold px-2 py-0.5 rounded">Premium</span>';
        }
        document.getElementById('badges').innerHTML = badgeHTML;

        // Main products tags
        const products = s.main_products || [];
        document.getElementById('main-products').innerHTML = products.map(p =>
          `<span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${p}</span>`
        ).join('');

        // Load this supplier's published products
        const { data: prods } = await supabaseClient
          .from('products')
          .select('id, title, price_min, price_max, currency, moq, main_image_url, images, is_featured, is_hot, is_best_price, is_top_seller')
          .eq('supplier_id', supplierId)
          .eq('status', 'published')
          .order('created_at', { ascending: false });

        const list = prods || [];
        document.getElementById('stat-products').textContent = list.length;

        if (list.length === 0) {
          document.getElementById('products-grid').classList.add('hidden');
          document.getElementById('no-products').classList.remove('hidden');
        } else {
          document.getElementById('products-grid').innerHTML = list.map(productCard).join('');
        }

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

      } catch (e) {
        console.error(e);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('not-found').classList.remove('hidden');
      }
    }

    loadSupplier();
  </script>
</body>
</html>
