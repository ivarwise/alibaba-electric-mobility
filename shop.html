<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – EVSource</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF6A00',
              dark: '#E55A00',
              navy: '#0F172A'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .cat-chip.active { background: #FF6A00; color: white; border-color: #FF6A00; }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .drawer { transform: translateX(-100%); transition: transform 0.28s ease; }
    .drawer.open { transform: translateX(0); }
    .drawer-backdrop { opacity: 0; pointer-events: none; transition: opacity 0.28s; }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- TOP BAR -->
  <div class="bg-slate-900 text-slate-300 text-[11px] py-1.5">
    <div class="max-w-6xl mx-auto px-4 flex justify-between">
      <span>Global Electric Mobility Trade</span>
      <a href="index.html" class="hover:text-white">Home</a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center gap-3 h-14">
        <button id="menu-btn" class="lg:hidden w-9 h-9 flex items-center justify-center text-slate-700">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
          <div class="w-8 h-8 rounded-lg bg-brand-orange flex items-center justify-center text-white font-black text-sm">EV</div>
          <span class="font-black text-slate-900 hidden sm:inline">EVSource</span>
        </a>
        <div class="flex-1 max-w-xl">
          <div class="flex">
            <input id="search-input" type="search" placeholder="Search products, bikes, batteries..."
                   class="w-full bg-slate-100 border border-slate-200 rounded-l-lg py-2 px-3 text-sm outline-none focus:ring-2 focus:ring-brand-orange/30 focus:border-brand-orange">
            <button id="search-btn" class="bg-brand-orange hover:bg-brand-dark text-white px-4 rounded-r-lg transition">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MOBILE CATEGORY DRAWER -->
  <div id="menu-backdrop" class="drawer-backdrop fixed inset-0 bg-black/40 z-50"></div>
  <div id="menu-drawer" class="drawer fixed top-0 left-0 h-full w-[280px] bg-white z-50 shadow-2xl flex flex-col">
    <div class="flex items-center justify-between px-4 py-3.5 border-b">
      <span class="font-bold text-slate-900">Categories</span>
      <button id="close-menu" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <nav id="mobile-cats" class="flex-1 overflow-y-auto py-2"></nav>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-5">

    <div class="flex gap-6">

      <!-- DESKTOP SIDEBAR -->
      <aside class="hidden lg:block w-52 flex-shrink-0">
        <div class="bg-white rounded-xl border border-slate-200 sticky top-20 overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100 font-bold text-sm text-slate-900">
            Categories
          </div>
          <nav id="desktop-cats" class="py-1">
            <div class="px-4 py-2"><div class="h-4 skeleton rounded w-3/4"></div></div>
            <div class="px-4 py-2"><div class="h-4 skeleton rounded w-2/3"></div></div>
          </nav>
        </div>
      </aside>

      <!-- PRODUCTS -->
      <div class="flex-1 min-w-0">

        <!-- Category chips (mobile) -->
        <div id="cat-chips" class="flex gap-2 overflow-x-auto pb-3 mb-1 lg:hidden scrollbar-hide"></div>

        <!-- Toolbar -->
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm text-slate-500">
            <span id="result-count">—</span> products
            <span id="active-filter" class="text-brand-orange font-medium"></span>
          </p>
          <select id="sort-select" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-orange/20">
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
          </select>
        </div>

        <!-- Grid -->
        <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4">
          <div class="bg-white rounded-xl border border-slate-100 h-64 skeleton"></div>
          <div class="bg-white rounded-xl border border-slate-100 h-64 skeleton"></div>
          <div class="bg-white rounded-xl border border-slate-100 h-64 skeleton hidden sm:block"></div>
          <div class="bg-white rounded-xl border border-slate-100 h-64 skeleton hidden xl:block"></div>
        </div>

        <div id="empty" class="hidden py-16 text-center">
          <i class="fa-solid fa-box-open text-3xl text-slate-300 mb-3"></i>
          <p class="text-slate-500 font-medium">No products found</p>
          <p class="text-sm text-slate-400 mt-1">Try another category or search</p>
          <button onclick="clearFilters()" class="mt-3 text-sm font-semibold text-brand-orange hover:underline">Clear filters</button>
        </div>

      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center text-xs">
      © 2026 EVSource · Electric Mobility B2B Marketplace
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://zgbdhpebmjokbaeflqhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    let currentCategory = params.get('category') || '';
    let currentQuery = params.get('q') || '';
    let allProducts = [];
    let categories = [];

    function formatPrice(min, max, currency = 'USD') {
      if (min == null && max == null) return 'Contact';
      const s = currency === 'USD' ? '$' : currency + ' ';
      if (min != null && max != null && min !== max) {
        return `${s}${Number(min).toLocaleString()} – ${s}${Number(max).toLocaleString()}`;
      }
      return `${s}${Number(min || max).toLocaleString()}`;
    }

    function productCard(p) {
      const img = p.main_image_url || (p.images && p.images[0]) || 'https://placehold.co/400x300?text=No+Image';
      const badges = [];
      if (p.is_top_seller) badges.push('<span class="bg-amber-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">Top Seller</span>');
      if (p.is_hot) badges.push('<span class="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">Hot</span>');
      if (p.is_best_price) badges.push('<span class="bg-emerald-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">Best Price</span>');

      return `
        <a href="product.html?id=${p.id}" class="bg-white rounded-xl border border-slate-100 overflow-hidden hover:shadow-md transition group block">
          <div class="relative aspect-[4/3] bg-slate-50 overflow-hidden">
            <img src="${img}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                 onerror="this.src='https://placehold.co/400x300?text=No+Image'">
            ${badges.length ? `<div class="absolute top-2 left-2 flex flex-wrap gap-1">${badges.join('')}</div>` : ''}
          </div>
          <div class="p-3">
            <h3 class="text-sm font-semibold text-slate-900 line-clamp-2 min-h-[40px] mb-1 group-hover:text-brand-orange transition">${p.title}</h3>
            <p class="text-brand-orange font-bold text-sm">${formatPrice(p.price_min, p.price_max, p.currency)}</p>
            <p class="text-[11px] text-slate-500 mt-0.5">MOQ: ${p.moq || 1}${p.country ? ' · ' + p.country : ''}</p>
          </div>
        </a>`;
    }

    async function loadCategories() {
      const { data } = await supabaseClient
        .from('categories')
        .select('id, name, slug, icon')
        .eq('is_active', true)
        .order('sort_order');

      categories = data || [];

      // Desktop
      const desk = document.getElementById('desktop-cats');
      desk.innerHTML = `
        <button onclick="selectCategory('')" class="w-full text-left px-4 py-2.5 text-sm hover:bg-orange-50 hover:text-brand-orange transition ${!currentCategory ? 'text-brand-orange font-semibold bg-orange-50' : 'text-slate-700'}">
          All Products
        </button>
        ${categories.map(c => `
          <button onclick="selectCategory('${c.slug}')" class="w-full text-left px-4 py-2.5 text-sm hover:bg-orange-50 hover:text-brand-orange transition flex items-center gap-2 ${currentCategory === c.slug ? 'text-brand-orange font-semibold bg-orange-50' : 'text-slate-700'}">
            <i class="fa-solid ${c.icon || 'fa-tag'} w-4 text-slate-400"></i>
            <span class="truncate">${c.name}</span>
          </button>
        `).join('')}`;

      // Mobile drawer
      document.getElementById('mobile-cats').innerHTML = `
        <button onclick="selectCategory(''); closeMenu()" class="w-full text-left px-4 py-3 text-sm hover:bg-slate-50 ${!currentCategory ? 'text-brand-orange font-semibold' : ''}">All Products</button>
        ${categories.map(c => `
          <button onclick="selectCategory('${c.slug}'); closeMenu()" class="w-full text-left px-4 py-3 text-sm hover:bg-slate-50 flex items-center gap-2 ${currentCategory === c.slug ? 'text-brand-orange font-semibold' : ''}">
            <i class="fa-solid ${c.icon || 'fa-tag'} w-5 text-slate-400"></i> ${c.name}
          </button>
        `).join('')}`;

      // Chips
      document.getElementById('cat-chips').innerHTML = `
        <button onclick="selectCategory('')" class="cat-chip flex-shrink-0 px-3 py-1.5 rounded-full border text-xs font-semibold ${!currentCategory ? 'active' : 'bg-white border-slate-200 text-slate-600'}">All</button>
        ${categories.map(c => `
          <button onclick="selectCategory('${c.slug}')" class="cat-chip flex-shrink-0 px-3 py-1.5 rounded-full border text-xs font-semibold ${currentCategory === c.slug ? 'active' : 'bg-white border-slate-200 text-slate-600'}">${c.name}</button>
        `).join('')}`;
    }

    async function loadProducts() {
      try {
        let query = supabaseClient
          .from('products')
          .select('id, title, price_min, price_max, currency, moq, main_image_url, images, country, is_featured, is_hot, is_best_price, is_top_seller, category_id, created_at, categories(slug)')
          .eq('status', 'published');

        const { data, error } = await query.order('created_at', { ascending: false });
        if (error) throw error;
        allProducts = data || [];
        applyFilters();
      } catch (e) {
        console.error(e);
        document.getElementById('products-grid').innerHTML =
          `<div class="col-span-full text-center py-12 text-red-500 text-sm">Failed to load products</div>`;
      }
    }

    function applyFilters() {
      let list = [...allProducts];

      if (currentCategory) {
        list = list.filter(p => p.categories?.slug === currentCategory);
      }
      if (currentQuery) {
        const q = currentQuery.toLowerCase();
        list = list.filter(p => (p.title || '').toLowerCase().includes(q) || (p.country || '').toLowerCase().includes(q));
      }

      const sort = document.getElementById('sort-select').value;
      if (sort === 'price_asc') list.sort((a, b) => (a.price_min || 0) - (b.price_min || 0));
      if (sort === 'price_desc') list.sort((a, b) => (b.price_min || 0) - (a.price_min || 0));
      if (sort === 'newest') list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      document.getElementById('result-count').textContent = list.length;
      document.getElementById('active-filter').textContent = currentCategory
        ? ' in ' + (categories.find(c => c.slug === currentCategory)?.name || currentCategory)
        : (currentQuery ? ` for “${currentQuery}”` : '');

      const grid = document.getElementById('products-grid');
      const empty = document.getElementById('empty');

      if (list.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.classList.remove('hidden');
        grid.innerHTML = list.map(productCard).join('');
      }

      // Update chips active state
      document.querySelectorAll('.cat-chip').forEach(btn => {
        const isAll = btn.textContent.trim() === 'All';
        const match = isAll ? !currentCategory : btn.textContent.trim() === (categories.find(c => c.slug === currentCategory)?.name);
        btn.classList.toggle('active', !!match);
      });
    }

    window.selectCategory = function(slug) {
      currentCategory = slug;
      currentQuery = '';
      document.getElementById('search-input').value = '';
      const url = new URL(window.location);
      if (slug) url.searchParams.set('category', slug);
      else url.searchParams.delete('category');
      url.searchParams.delete('q');
      history.replaceState(null, '', url);
      loadCategories();
      applyFilters();
    };

    window.clearFilters = function() {
      currentCategory = '';
      currentQuery = '';
      document.getElementById('search-input').value = '';
      history.replaceState(null, '', 'shop.html');
      loadCategories();
      applyFilters();
    };

    function doSearch() {
      currentQuery = document.getElementById('search-input').value.trim();
      currentCategory = '';
      const url = new URL(window.location);
      if (currentQuery) url.searchParams.set('q', currentQuery);
      else url.searchParams.delete('q');
      url.searchParams.delete('category');
      history.replaceState(null, '', url);
      loadCategories();
      applyFilters();
    }

    document.getElementById('search-btn').addEventListener('click', doSearch);
    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
    document.getElementById('sort-select').addEventListener('change', applyFilters);

    // Mobile menu
    const drawer = document.getElementById('menu-drawer');
    const backdrop = document.getElementById('menu-backdrop');
    function openMenu() {
      drawer.classList.add('open');
      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
    }
    window.closeMenu = closeMenu;
    document.getElementById('menu-btn').addEventListener('click', openMenu);
    document.getElementById('close-menu').addEventListener('click', closeMenu);
    backdrop.addEventListener('click', closeMenu);

    // Init
    if (currentQuery) document.getElementById('search-input').value = currentQuery;
    loadCategories();
    loadProducts();
  </script>
</body>
</html>
