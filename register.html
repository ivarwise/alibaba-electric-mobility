<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Free – Alibaba</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #F3F4F6; }
    .text-ali-orange { color: #FF6600; }
    .bg-ali-orange { background-color: #FF6600; }
    .border-ali-orange { border-color: #FF6600; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center">
        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
      </a>
      <a href="index.html" class="flex items-center gap-1.5">
        <span class="text-xl font-black text-ali-orange italic">Alibaba</span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">

      <div class="text-center mb-6">
        <h1 class="text-xl font-black text-gray-900">Join Free</h1>
        <p class="text-sm text-gray-500 mt-1">Create your buyer account in seconds</p>
      </div>

      <form id="register-form" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 sm:p-6 space-y-4">

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Full Name *</label>
          <input id="full_name" type="text" required placeholder="Your full name"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Email *</label>
          <input id="email" type="email" required placeholder="you@email.com"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Phone *</label>
          <input id="phone" type="tel" required placeholder="e.g. 08012345678"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Password *</label>
          <div class="relative">
            <input id="password" type="password" required minlength="6" placeholder="At least 6 characters"
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange pr-11" />
            <button type="button" id="toggle-pass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Confirm Password *</label>
          <input id="password2" type="password" required minlength="6" placeholder="Repeat password"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange" />
        </div>

        <p id="error-msg" class="hidden text-red-500 text-xs font-medium"></p>
        <p id="success-msg" class="hidden text-emerald-600 text-xs font-medium"></p>

        <button type="submit" id="submit-btn"
                class="w-full bg-ali-orange hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
          <span id="btn-text">Create Account</span>
          <i id="btn-spinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
        </button>

        <p class="text-center text-xs text-gray-500">
          Already have an account?
          <a href="login.html" class="text-ali-orange font-bold hover:underline">Sign In</a>
        </p>
      </form>

      <p class="text-center text-[10px] text-gray-400 mt-4">
        By joining you agree to our Terms & Privacy Policy
      </p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://zgbdhpebmjokbaeflqhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Already logged in? → account
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'account.html';
    });

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      const errEl = document.getElementById('error-msg');
      const okEl = document.getElementById('success-msg');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      if (password !== password2) {
        errEl.textContent = 'Passwords do not match';
        errEl.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters';
        errEl.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      btn.disabled = true;
      btnText.textContent = 'Creating account...';
      spinner.classList.remove('hidden');

      try {
        // 1. Create auth user
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { full_name, phone }
          }
        });

        if (authError) throw authError;
        if (!authData.user) throw new Error('Registration failed');

        // 2. Create / update profile row
        const { error: profileError } = await supabaseClient
          .from('profiles')
          .upsert({
            id: authData.user.id,
            full_name,
            phone,
            email,
            role: 'buyer',
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' });

        if (profileError) {
          console.warn('Profile upsert:', profileError.message);
          // Still continue — auth user exists
        }

        okEl.textContent = 'Account created! Redirecting...';
        okEl.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'account.html';
        }, 800);

      } catch (err) {
        console.error(err);
        errEl.textContent = err.message || 'Could not create account';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Create Account';
        spinner.classList.add('hidden');
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
