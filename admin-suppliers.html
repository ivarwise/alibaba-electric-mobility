<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suppliers – EVSource Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF6A00',
              dark: '#E55A00',
              navy: '#0F172A'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-link.active { background: rgba(255, 106, 0, 0.12); color: #FF6A00; }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="flex flex-col h-full">
        <div class="px-6 py-5 border-b border-slate-800">
          <a href="admin-dashboard.html" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-brand-orange flex items-center justify-center text-white font-black text-sm">EV</div>
            <div>
              <p class="font-bold text-white leading-none">EVSource</p>
              <p class="text-[10px] text-slate-500">Admin Panel</p>
            </div>
          </a>
        </div>

        <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Main</p>
          <a href="admin-dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
          </a>
          <a href="admin-products.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-box w-5 text-center"></i> Products
          </a>
          <a href="admin-suppliers.html" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
            <i class="fa-solid fa-building w-5 text-center"></i> Suppliers
          </a>
          <a href="admin-orders.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-cart-shopping w-5 text-center"></i> Orders
          </a>
          <a href="admin-quotations.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-file-invoice w-5 text-center"></i> Quotations
          </a>
          <a href="admin-categories.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-tags w-5 text-center"></i> Categories
          </a>
        </nav>

        <div class="px-4 py-4 border-t border-slate-800">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-brand-orange flex items-center justify-center text-sm font-bold" id="admin-avatar">A</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate" id="admin-name">Admin</p>
              <p class="text-xs text-slate-500 truncate" id="admin-email">—</p>
            </div>
            <button id="logout-btn" class="text-slate-500 hover:text-red-400 transition">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="flex-1 lg:ml-64">

      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="flex items-center justify-between px-4 sm:px-6 h-14">
          <div class="flex items-center gap-3">
            <button id="sidebar-toggle" class="lg:hidden text-slate-600 text-xl">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-base font-bold text-slate-900">Suppliers</h1>
          </div>
          <button id="open-add-btn"
                  class="bg-brand-orange hover:bg-brand-dark text-white text-sm font-bold px-4 py-2 rounded-lg transition flex items-center gap-2">
            <i class="fa-solid fa-plus text-xs"></i>
            <span class="hidden sm:inline">Add Supplier</span>
          </button>
        </div>
      </header>

      <main class="p-4 sm:p-6 lg:p-8">

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-slate-900" id="stat-total">—</p>
            <p class="text-xs text-slate-500">Total Suppliers</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-amber-600" id="stat-gold">—</p>
            <p class="text-xs text-slate-500">Gold</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-blue-600" id="stat-verified">—</p>
            <p class="text-xs text-slate-500">Verified</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-emerald-600" id="stat-active">—</p>
            <p class="text-xs text-slate-500">Active</p>
          </div>
        </div>

        <!-- Search -->
        <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-4 mb-5">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input id="search-input" type="search" placeholder="Search suppliers..."
                   class="w-full border border-slate-200 rounded-lg pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
          </div>
        </div>

        <!-- List -->
        <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
          <div id="suppliers-container">
            <div class="p-4 space-y-3">
              <div class="h-16 skeleton rounded-lg"></div>
              <div class="h-16 skeleton rounded-lg"></div>
              <div class="h-16 skeleton rounded-lg"></div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" id="modal-backdrop"></div>
    <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center p-0 sm:p-4">
      <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[90vh] overflow-y-auto shadow-xl">
        <div class="sticky top-0 bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between">
          <h2 class="font-bold text-slate-900" id="modal-title">Add Supplier</h2>
          <button id="close-modal" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="supplier-form" class="p-5 space-y-4">
          <input type="hidden" id="edit-id">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Company Name *</label>
            <input id="company_name" type="text" required placeholder="e.g. Shenzhen EV Tech Co., Ltd."
                   class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Country</label>
              <input id="country" type="text" placeholder="China"
                     class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">City</label>
              <input id="city" type="text" placeholder="Shenzhen"
                     class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Years in Business</label>
              <input id="years_in_business" type="number" min="0" value="0"
                     class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Badge</label>
              <select id="badge" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 bg-white">
                <option value="none">None</option>
                <option value="verified">Verified</option>
                <option value="gold">Gold</option>
                <option value="premium">Premium</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Main Products (comma separated)</label>
            <input id="main_products" type="text" placeholder="Electric Bikes, Batteries, Chargers"
                   class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Description</label>
            <textarea id="description" rows="2" placeholder="Short company description..."
                      class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange resize-none"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Logo URL (optional)</label>
            <input id="logo_url" type="url" placeholder="https://..."
                   class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
          </div>
          <div class="flex items-center gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="is_verified" class="w-4 h-4 rounded text-brand-orange">
              <span class="text-sm font-medium">Verified</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="is_gold" class="w-4 h-4 rounded text-brand-orange">
              <span class="text-sm font-medium">Gold</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="is_active" checked class="w-4 h-4 rounded text-brand-orange">
              <span class="text-sm font-medium">Active</span>
            </label>
          </div>
          <button type="submit" id="save-btn"
                  class="w-full bg-brand-orange hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition">
            Save Supplier
          </button>
        </form>
      </div>
    </div>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition z-[100]">
    <span id="toast-msg"></span>
  </div>

  <script>
    const SUPABASE_URL = "https://zgbdhpebmjokbaeflqhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allSuppliers = [];

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    });
    overlay?.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }

    function badgeHTML(s) {
      if (s.is_gold || s.badge === 'gold') return '<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-1.5 py-0.5 rounded">Gold</span>';
      if (s.is_verified || s.badge === 'verified') return '<span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded">Verified</span>';
      if (s.badge === 'premium') return '<span class="bg-violet-100 text-violet-700 text-[10px] font-bold px-1.5 py-0.5 rounded">Premium</span>';
      return '';
    }

    function renderSuppliers(list) {
      const el = document.getElementById('suppliers-container');
      if (!list.length) {
        el.innerHTML = `
          <div class="py-16 text-center">
            <i class="fa-solid fa-building text-3xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium">No suppliers yet</p>
            <button onclick="openModal()" class="mt-3 text-sm font-semibold text-brand-orange hover:underline">Add your first supplier →</button>
          </div>`;
        return;
      }

      el.innerHTML = `
        <div class="divide-y divide-slate-100">
          ${list.map(s => `
            <div class="flex items-center gap-3 px-4 py-3.5 hover:bg-slate-50 transition">
              <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0 overflow-hidden">
                ${s.logo_url
                  ? `<img src="${s.logo_url}" class="w-full h-full object-cover" alt="">`
                  : `<span class="font-bold text-slate-400 text-lg">${(s.company_name || 'S')[0]}</span>`}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <p class="font-semibold text-slate-900 truncate">${s.company_name}</p>
                  ${badgeHTML(s)}
                  ${!s.is_active ? '<span class="text-[10px] font-bold text-slate-400">Inactive</span>' : ''}
                </div>
                <p class="text-[11px] text-slate-500 mt-0.5">
                  ${s.country || '—'}${s.years_in_business ? ' · ' + s.years_in_business + ' yrs' : ''}
                  ${(s.main_products || []).length ? ' · ' + s.main_products.slice(0, 2).join(', ') : ''}
                </p>
              </div>
              <div class="flex items-center gap-1 flex-shrink-0">
                <button onclick='editSupplier(${JSON.stringify(s).replace(/'/g, "&#39;")})'
                        class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500" title="Edit">
                  <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button onclick="deleteSupplier('${s.id}', '${(s.company_name || '').replace(/'/g, "\\'")}')"
                        class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center text-slate-500 hover:text-red-500" title="Delete">
                  <i class="fa-solid fa-trash text-xs"></i>
                </button>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    function applySearch() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      let list = allSuppliers;
      if (q) {
        list = list.filter(s =>
          (s.company_name || '').toLowerCase().includes(q) ||
          (s.country || '').toLowerCase().includes(q) ||
          (s.city || '').toLowerCase().includes(q) ||
          (s.main_products || []).join(' ').toLowerCase().includes(q)
        );
      }
      renderSuppliers(list);
    }

    async function loadSuppliers() {
      try {
        const { data, error } = await supabaseClient
          .from('suppliers')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        allSuppliers = data || [];

        document.getElementById('stat-total').textContent = allSuppliers.length;
        document.getElementById('stat-gold').textContent = allSuppliers.filter(s => s.is_gold || s.badge === 'gold').length;
        document.getElementById('stat-verified').textContent = allSuppliers.filter(s => s.is_verified || s.badge === 'verified').length;
        document.getElementById('stat-active').textContent = allSuppliers.filter(s => s.is_active).length;

        applySearch();
      } catch (e) {
        console.error(e);
        document.getElementById('suppliers-container').innerHTML =
          `<div class="py-12 text-center text-red-500 text-sm">Failed to load: ${e.message}</div>`;
      }
    }

    // Modal
    const modal = document.getElementById('modal');
    function openModal(edit = null) {
      document.getElementById('modal-title').textContent = edit ? 'Edit Supplier' : 'Add Supplier';
      document.getElementById('edit-id').value = edit?.id || '';
      document.getElementById('company_name').value = edit?.company_name || '';
      document.getElementById('country').value = edit?.country || '';
      document.getElementById('city').value = edit?.city || '';
      document.getElementById('years_in_business').value = edit?.years_in_business || 0;
      document.getElementById('badge').value = edit?.badge || 'none';
      document.getElementById('main_products').value = (edit?.main_products || []).join(', ');
      document.getElementById('description').value = edit?.description || '';
      document.getElementById('logo_url').value = edit?.logo_url || '';
      document.getElementById('is_verified').checked = !!edit?.is_verified;
      document.getElementById('is_gold').checked = !!edit?.is_gold;
      document.getElementById('is_active').checked = edit ? !!edit.is_active : true;
      modal.classList.remove('hidden');
    }
    function closeModal() {
      modal.classList.add('hidden');
    }
    window.openModal = openModal;
    document.getElementById('open-add-btn').addEventListener('click', () => openModal());
    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', closeModal);

    window.editSupplier = function(s) {
      openModal(s);
    };

    document.getElementById('supplier-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const company_name = document.getElementById('company_name').value.trim();
      const slug = company_name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      const main_products = document.getElementById('main_products').value
        .split(',').map(t => t.trim()).filter(Boolean);

      const payload = {
        company_name,
        slug,
        country: document.getElementById('country').value.trim() || null,
        city: document.getElementById('city').value.trim() || null,
        years_in_business: parseInt(document.getElementById('years_in_business').value) || 0,
        badge: document.getElementById('badge').value,
        main_products,
        description: document.getElementById('description').value.trim() || null,
        logo_url: document.getElementById('logo_url').value.trim() || null,
        is_verified: document.getElementById('is_verified').checked,
        is_gold: document.getElementById('is_gold').checked,
        is_active: document.getElementById('is_active').checked
      };

      try {
        if (id) {
          const { error } = await supabaseClient.from('suppliers').update(payload).eq('id', id);
          if (error) throw error;
          showToast('Supplier updated');
        } else {
          const { error } = await supabaseClient.from('suppliers').insert([payload]);
          if (error) throw error;
          showToast('Supplier added');
        }
        closeModal();
        loadSuppliers();
      } catch (err) {
        alert(err.message || 'Failed to save');
      }
    });

    window.deleteSupplier = async function(id, name) {
      if (!confirm(`Delete "${name}"?\nProducts linked to this supplier may be affected.`)) return;
      try {
        const { error } = await supabaseClient.from('suppliers').delete().eq('id', id);
        if (error) throw error;
        showToast('Supplier deleted');
        loadSuppliers();
      } catch (e) {
        alert(e.message || 'Failed to delete');
      }
    };

    document.getElementById('search-input').addEventListener('input', applySearch);

    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', user.id).single();
        const name = profile?.full_name || user.email?.split('@')[0] || 'Admin';
        document.getElementById('admin-name').textContent = name;
        document.getElementById('admin-email').textContent = user.email || '';
        document.getElementById('admin-avatar').textContent = name.charAt(0).toUpperCase();
      }
    }

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      if (!confirm('Logout?')) return;
      await supabaseClient.auth.signOut();
      window.location.href = 'admin-login.html';
    });

    checkAuth();
    loadSuppliers();
  </script>
</body>
</html>
