<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .image-preview { width: 85px; height: 85px; object-fit: cover; border-radius: 8px; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="font-bold text-orange-600 text-lg">Admin Dashboard</div>
        <a href="index.html" class="text-sm text-orange-600">View Public →</a>
    </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 space-y-6">

    <!-- FORM -->
    <div class="bg-white rounded-xl shadow-sm border p-5">
        <h2 id="formTitle" class="text-lg font-bold mb-4">Add New Product</h2>

        <form id="productForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Product Name *</label>
                <input type="text" id="title" required
                       class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500"
                       placeholder="Electric Mountain Bike 750W">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Min Price ($)</label>
                    <input type="number" id="priceMin" step="0.01"
                           class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Max Price ($)</label>
                    <input type="number" id="priceMax" step="0.01"
                           class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">MOQ</label>
                <input type="number" id="moq" value="1" min="1"
                       class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500">
            </div>

            <!-- Category - FREE TEXT as you requested -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Category (type freely)</label>
                <input type="text" id="categoryName"
                       class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500"
                       placeholder="Electric Bikes, Batteries, Scooters...">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Country</label>
                <input type="text" id="country" value="China"
                       class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Status</label>
                <select id="status" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500">
                    <option value="published">Published (show on public)</option>
                    <option value="draft">Draft (hidden)</option>
                </select>
            </div>

            <div class="flex flex-wrap gap-4 text-sm">
                <label class="flex items-center gap-2"><input type="checkbox" id="isFeatured"> Featured</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="isHot"> Hot</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="isBestPrice"> Best Price</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="isTopSeller"> Top Seller</label>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Long Description</label>
                <textarea id="description" rows="4"
                          class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500"
                          placeholder="Write full product details..."></textarea>
            </div>

            <!-- IMAGE UPLOAD - iOS FRIENDLY -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Photos (max 10)</label>
                
                <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center bg-gray-50 active:bg-orange-50">
                    <i class="fa-solid fa-camera text-3xl text-gray-400 mb-2"></i>
                    <p class="text-sm text-gray-600 font-medium">Tap to select photos</p>
                    <p class="text-xs text-gray-400 mt-1">You can select multiple</p>
                </div>

                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">

                <div id="imagePreview" class="flex flex-wrap gap-2 mt-3"></div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl text-sm">
                Publish Product
            </button>

            <button type="button" id="cancelEdit" class="hidden w-full border py-2.5 rounded-xl text-sm mt-2">
                Cancel Edit
            </button>
        </form>
    </div>

    <!-- PRODUCTS LIST -->
    <div class="bg-white rounded-xl shadow-sm border p-5">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold">Your Products</h2>
            <span id="productCount" class="text-xs text-gray-500">0</span>
        </div>
        <div id="productsList" class="space-y-3"></div>
        <div id="emptyList" class="text-center py-10 text-gray-400 text-sm">
            No products yet
        </div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://zgbdhpebmjokbaeflqhj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let selectedFiles = [];
    let existingImages = [];
    let editingId = null;

    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const imagePreview = document.getElementById('imagePreview');
    const form = document.getElementById('productForm');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEdit = document.getElementById('cancelEdit');

    // ========== IMAGE PICKER (works on iOS) ==========
    dropZone.addEventListener('click', () => {
        imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (selectedFiles.length + existingImages.length + files.length > 10) {
            alert('Maximum 10 photos');
            return;
        }
        selectedFiles = selectedFiles.concat(files);
        renderPreviews();
        imageInput.value = '';
    });

    function renderPreviews() {
        imagePreview.innerHTML = '';

        existingImages.forEach((url, i) => {
            const div = document.createElement('div');
            div.className = 'relative';
            div.innerHTML = `
                <img src="${url}" class="image-preview border">
                <button type="button" onclick="removeExisting(${i})"
                    class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">×</button>
            `;
            imagePreview.appendChild(div);
        });

        selectedFiles.forEach((file, i) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const div = document.createElement('div');
                div.className = 'relative';
                div.innerHTML = `
                    <img src="${e.target.result}" class="image-preview border">
                    <button type="button" onclick="removeNew(${i})"
                        class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">×</button>
                `;
                imagePreview.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    }

    window.removeExisting = (i) => {
        existingImages.splice(i, 1);
        renderPreviews();
    };
    window.removeNew = (i) => {
        selectedFiles.splice(i, 1);
        renderPreviews();
    };

    // ========== UPLOAD IMAGES ==========
    async function uploadImages() {
        const urls = [...existingImages];

        for (const file of selectedFiles) {
            const ext = file.name.split('.').pop() || 'jpg';
            const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
            const path = `products/${fileName}`;

            const { error } = await supabase.storage
                .from('product-images')
                .upload(path, file);

            if (error) {
                console.error(error);
                alert('Upload failed: ' + error.message);
                throw error;
            }

            const { data } = supabase.storage.from('product-images').getPublicUrl(path);
            urls.push(data.publicUrl);
        }
        return urls;
    }

    // ========== GET OR CREATE SUPPLIER ==========
    async function getSupplierId() {
        let { data } = await supabase.from('suppliers').select('id').limit(1).maybeSingle();
        if (data) return data.id;

        const { data: newSup, error } = await supabase.from('suppliers').insert([{
            company_name: 'Main Supplier',
            country: 'China',
            is_verified: true,
            is_active: true
        }]).select().single();

        if (error) throw error;
        return newSup.id;
    }

    // ========== GET OR CREATE CATEGORY ==========
    async function getCategoryId(name) {
        if (!name || !name.trim()) return null;
        const clean = name.trim();

        let { data } = await supabase
            .from('categories')
            .select('id')
            .ilike('name', clean)
            .maybeSingle();

        if (data) return data.id;

        const slug = clean.toLowerCase().replace(/\s+/g, '-');
        const { data: newCat, error } = await supabase.from('categories').insert([{
            name: clean,
            slug: slug,
            is_active: true
        }]).select().single();

        if (error) {
            console.error(error);
            return null;
        }
        return newCat.id;
    }

    // ========== SUBMIT ==========
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        try {
            if (selectedFiles.length + existingImages.length === 0) {
                alert('Please select at least 1 photo');
                return;
            }

            const imageUrls = await uploadImages();
            const supplierId = await getSupplierId();
            const categoryId = await getCategoryId(document.getElementById('categoryName').value);

            const payload = {
                title: document.getElementById('title').value.trim(),
                price_min: parseFloat(document.getElementById('priceMin').value) || null,
                price_max: parseFloat(document.getElementById('priceMax').value) || null,
                moq: parseInt(document.getElementById('moq').value) || 1,
                category_id: categoryId,
                country: document.getElementById('country').value.trim() || 'China',
                status: document.getElementById('status').value,
                is_featured: document.getElementById('isFeatured').checked,
                is_hot: document.getElementById('isHot').checked,
                is_best_price: document.getElementById('isBestPrice').checked,
                is_top_seller: document.getElementById('isTopSeller').checked,
                description: document.getElementById('description').value.trim(),
                main_image_url: imageUrls[0],
                images: imageUrls,
                supplier_id: supplierId
            };

            let result;
            if (editingId) {
                result = await supabase.from('products').update(payload).eq('id', editingId).select();
            } else {
                result = await supabase.from('products').insert([payload]).select();
            }

            if (result.error) throw result.error;

            alert(editingId ? 'Product updated!' : 'Product published successfully!');
            resetForm();
            loadProducts();

        } catch (err) {
            console.error(err);
            alert('Error: ' + (err.message || JSON.stringify(err)));
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = editingId ? 'Update Product' : 'Publish Product';
        }
    });

    // ========== LOAD PRODUCTS ==========
    async function loadProducts() {
        const { data, error } = await supabase
            .from('products')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        const list = data || [];
        document.getElementById('productCount').textContent = list.length + ' products';

        const container = document.getElementById('productsList');
        const empty = document.getElementById('emptyList');

        if (list.length === 0) {
            container.innerHTML = '';
            empty.style.display = 'block';
            return;
        }

        empty.style.display = 'none';
        container.innerHTML = list.map(p => `
            <div class="flex gap-3 p-3 border rounded-xl">
                <img src="${p.main_image_url || 'https://via.placeholder.com/80'}" class="w-16 h-16 object-cover rounded-lg">
                <div class="flex-1 min-w-0">
                    <div class="font-semibold text-sm truncate">${p.title}</div>
                    <div class="text-xs text-gray-500">$${p.price_min || 0} - $${p.price_max || 0}</div>
                    <div class="text-xs mt-1">
                        <span class="${p.status === 'published' ? 'text-green-600' : 'text-gray-500'}">${p.status}</span>
                    </div>
                    <div class="flex gap-3 mt-1">
                        <button onclick="editProduct('${p.id}')" class="text-xs text-blue-600">Edit</button>
                        <button onclick="deleteProduct('${p.id}')" class="text-xs text-red-600">Delete</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // ========== EDIT ==========
    window.editProduct = async (id) => {
        const { data, error } = await supabase.from('products').select('*').eq('id', id).single();
        if (error || !data) return alert('Not found');

        editingId = id;
        document.getElementById('formTitle').textContent = 'Edit Product';
        submitBtn.textContent = 'Update Product';
        cancelEdit.classList.remove('hidden');

        document.getElementById('title').value = data.title || '';
        document.getElementById('priceMin').value = data.price_min || '';
        document.getElementById('priceMax').value = data.price_max || '';
        document.getElementById('moq').value = data.moq || 1;
        document.getElementById('country').value = data.country || 'China';
        document.getElementById('status').value = data.status || 'published';
        document.getElementById('description').value = data.description || '';
        document.getElementById('isFeatured').checked = !!data.is_featured;
        document.getElementById('isHot').checked = !!data.is_hot;
        document.getElementById('isBestPrice').checked = !!data.is_best_price;
        document.getElementById('isTopSeller').checked = !!data.is_top_seller;

        // try to show category name
        if (data.category_id) {
            const { data: cat } = await supabase.from('categories').select('name').eq('id', data.category_id).single();
            document.getElementById('categoryName').value = cat?.name || '';
        } else {
            document.getElementById('categoryName').value = '';
        }

        existingImages = data.images || (data.main_image_url ? [data.main_image_url] : []);
        selectedFiles = [];
        renderPreviews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    cancelEdit.addEventListener('click', resetForm);

    function resetForm() {
        editingId = null;
        form.reset();
        selectedFiles = [];
        existingImages = [];
        imagePreview.innerHTML = '';
        document.getElementById('formTitle').textContent = 'Add New Product';
        submitBtn.textContent = 'Publish Product';
        cancelEdit.classList.add('hidden');
        document.getElementById('status').value = 'published';
        document.getElementById('country').value = 'China';
        document.getElementById('moq').value = 1;
    }

    // ========== DELETE ==========
    window.deleteProduct = async (id) => {
        if (!confirm('Delete this product?')) return;
        const { error } = await supabase.from('products').delete().eq('id', id);
        if (error) alert(error.message);
        else loadProducts();
    };

    // INIT
    loadProducts();
</script>
</body>
</html>
