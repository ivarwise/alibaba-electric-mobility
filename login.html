<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Alibaba</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #F3F4F6; }
    .text-ali-orange { color: #FF6600; }
    .bg-ali-orange { background-color: #FF6600; }
    .border-ali-orange { border-color: #FF6600; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center">
        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
      </a>
      <a href="index.html" class="flex items-center gap-1.5">
        <span class="text-xl font-black text-ali-orange italic">Alibaba</span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">

      <div class="text-center mb-6">
        <h1 class="text-xl font-black text-gray-900">Sign In</h1>
        <p class="text-sm text-gray-500 mt-1">Welcome back to Alibaba</p>
      </div>

      <form id="login-form" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 sm:p-6 space-y-4">

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Email *</label>
          <input id="email" type="email" required placeholder="you@email.com" autocomplete="email"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Password *</label>
          <div class="relative">
            <input id="password" type="password" required placeholder="Your password" autocomplete="current-password"
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ali-orange pr-11" />
            <button type="button" id="toggle-pass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded text-ali-orange" />
            <span class="text-xs text-gray-600">Remember me</span>
          </label>
          <a href="forgot-password.html" class="text-xs font-semibold text-ali-orange hover:underline">Forgot password?</a>
        </div>

        <p id="error-msg" class="hidden text-red-500 text-xs font-medium"></p>

        <button type="submit" id="submit-btn"
                class="w-full bg-ali-orange hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
          <span id="btn-text">Sign In</span>
          <i id="btn-spinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
        </button>

        <p class="text-center text-xs text-gray-500">
          Don’t have an account?
          <a href="register.html" class="text-ali-orange font-bold hover:underline">Join Free</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://zgbdhpebmjokbaeflqhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Already logged in?
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'account.html';
    });

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');

      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      spinner.classList.remove('hidden');

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        if (!data.session) throw new Error('Login failed');

        window.location.href = 'account.html';

      } catch (err) {
        console.error(err);
        errEl.textContent = err.message || 'Invalid email or password';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        spinner.classList.add('hidden');
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
