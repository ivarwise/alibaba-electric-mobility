<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – EVSource Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF6A00',
              dark: '#E55A00',
              navy: '#0F172A'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-link.active { background: rgba(255, 106, 0, 0.12); color: #FF6A00; }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="flex flex-col h-full">
        <div class="px-6 py-5 border-b border-slate-800">
          <a href="admin-dashboard.html" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-brand-orange flex items-center justify-center text-white font-black text-sm">EV</div>
            <div>
              <p class="font-bold text-white leading-none">EVSource</p>
              <p class="text-[10px] text-slate-500">Admin Panel</p>
            </div>
          </a>
        </div>

        <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Main</p>
          <a href="admin-dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
          </a>
          <a href="admin-products.html" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
            <i class="fa-solid fa-box w-5 text-center"></i> Products
          </a>
          <a href="admin-suppliers.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-building w-5 text-center"></i> Suppliers
          </a>
          <a href="admin-orders.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-cart-shopping w-5 text-center"></i> Orders
          </a>
          <a href="admin-quotations.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-file-invoice w-5 text-center"></i> Quotations
          </a>
          <a href="admin-categories.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-tags w-5 text-center"></i> Categories
          </a>
        </nav>

        <div class="px-4 py-4 border-t border-slate-800">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-brand-orange flex items-center justify-center text-sm font-bold" id="admin-avatar">A</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate" id="admin-name">Admin</p>
              <p class="text-xs text-slate-500 truncate" id="admin-email">—</p>
            </div>
            <button id="logout-btn" class="text-slate-500 hover:text-red-400 transition">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="flex-1 lg:ml-64">

      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="flex items-center justify-between px-4 sm:px-6 h-14">
          <div class="flex items-center gap-3">
            <button id="sidebar-toggle" class="lg:hidden text-slate-600 text-xl">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-base font-bold text-slate-900">Products</h1>
          </div>
          <a href="admin-product-create.html"
             class="bg-brand-orange hover:bg-brand-dark text-white text-sm font-bold px-4 py-2 rounded-lg transition flex items-center gap-2">
            <i class="fa-solid fa-plus text-xs"></i>
            <span class="hidden sm:inline">Add Product</span>
          </a>
        </div>
      </header>

      <main class="p-4 sm:p-6 lg:p-8">

        <!-- Filters -->
        <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-4 mb-5 flex flex-col sm:flex-row gap-3 sm:items-center">
          <div class="flex-1 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input id="search-input" type="search" placeholder="Search products..."
                   class="w-full border border-slate-200 rounded-lg pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange">
          </div>
          <select id="status-filter"
                  class="border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/20 bg-white">
            <option value="">All Status</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="pending">Pending</option>
            <option value="archived">Archived</option>
          </select>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-slate-900" id="stat-total">—</p>
            <p class="text-xs text-slate-500">Total Products</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-emerald-600" id="stat-published">—</p>
            <p class="text-xs text-slate-500">Published</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-amber-600" id="stat-draft">—</p>
            <p class="text-xs text-slate-500">Draft</p>
          </div>
          <div class="bg-white rounded-xl border border-slate-100 p-4">
            <p class="text-2xl font-black text-blue-600" id="stat-pending">—</p>
            <p class="text-xs text-slate-500">Pending</p>
          </div>
        </div>

        <!-- Products List -->
        <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
          <div id="products-container">
            <!-- Loading skeleton -->
            <div class="p-4 space-y-3">
              <div class="h-16 skeleton rounded-lg"></div>
              <div class="h-16 skeleton rounded-lg"></div>
              <div class="h-16 skeleton rounded-lg"></div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition z-[100]">
    <span id="toast-msg"></span>
  </div>

  <script>
    const SUPABASE_URL = "https://zgbdhpebmjokbaeflqhj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5osddO3GFnJlQYIvSHS3Q_WqF72WwV";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    });
    overlay?.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }

    function formatPrice(min, max, currency = 'USD') {
      if (min == null && max == null) return '—';
      const s = currency === 'USD' ? '$' : currency + ' ';
      if (min != null && max != null && min !== max) return `${s}${Number(min).toLocaleString()} – ${s}${Number(max).toLocaleString()}`;
      return `${s}${Number(min || max).toLocaleString()}`;
    }

    function statusBadge(status) {
      const map = {
        published: 'bg-emerald-100 text-emerald-700',
        draft: 'bg-slate-100 text-slate-600',
        pending: 'bg-amber-100 text-amber-700',
        rejected: 'bg-red-100 text-red-700',
        archived: 'bg-slate-100 text-slate-500'
      };
      return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${map[status] || 'bg-slate-100 text-slate-600'}">${status}</span>`;
    }

    function renderProducts(products) {
      const el = document.getElementById('products-container');

      if (!products.length) {
        el.innerHTML = `
          <div class="py-16 text-center">
            <i class="fa-solid fa-box-open text-3xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium">No products found</p>
            <a href="admin-product-create.html" class="inline-block mt-3 text-sm font-semibold text-brand-orange hover:underline">Add your first product →</a>
          </div>`;
        return;
      }

      el.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-100">
              <tr class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <th class="px-4 py-3">Product</th>
                <th class="px-4 py-3 hidden md:table-cell">Price</th>
                <th class="px-4 py-3 hidden sm:table-cell">MOQ</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${products.map(p => {
                const img = p.main_image_url || (p.images && p.images[0]) || 'https://placehold.co/80x80?text=No+Img';
                return `
                <tr class="hover:bg-slate-50 transition">
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-3">
                      <img src="${img}" class="w-12 h-12 rounded-lg object-cover bg-slate-100 flex-shrink-0" onerror="this.src='https://placehold.co/80x80?text=No+Img'">
                      <div class="min-w-0">
                        <p class="font-semibold text-slate-900 truncate max-w-[180px] sm:max-w-xs">${p.title}</p>
                        <p class="text-[11px] text-slate-400 truncate">${p.suppliers?.company_name || '—'}</p>
                      </div>
                    </div>
                  </td>
                  <td class="px-4 py-3 hidden md:table-cell font-medium text-slate-800">
                    ${formatPrice(p.price_min, p.price_max, p.currency)}
                  </td>
                  <td class="px-4 py-3 hidden sm:table-cell text-slate-600">${p.moq || 1}</td>
                  <td class="px-4 py-3">${statusBadge(p.status)}</td>
                  <td class="px-4 py-3">
                    <div class="flex items-center justify-end gap-1">
                      <a href="product.html?id=${p.id}" target="_blank" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500" title="View">
                        <i class="fa-solid fa-eye text-xs"></i>
                      </a>
                      <a href="admin-product-edit.html?id=${p.id}" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500" title="Edit">
                        <i class="fa-solid fa-pen text-xs"></i>
                      </a>
                      <button onclick="deleteProduct('${p.id}', '${p.title.replace(/'/g, "\\'")}')" class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center text-slate-500 hover:text-red-500" title="Delete">
                        <i class="fa-solid fa-trash text-xs"></i>
                      </button>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }

    async function loadProducts() {
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select(`
            id, title, slug, price_min, price_max, currency, moq, main_image_url, images, status, created_at,
            suppliers (company_name)
          `)
          .order('created_at', { ascending: false });

        if (error) throw error;
        allProducts = data || [];

        // Stats
        document.getElementById('stat-total').textContent = allProducts.length;
        document.getElementById('stat-published').textContent = allProducts.filter(p => p.status === 'published').length;
        document.getElementById('stat-draft').textContent = allProducts.filter(p => p.status === 'draft').length;
        document.getElementById('stat-pending').textContent = allProducts.filter(p => p.status === 'pending').length;

        applyFilters();
      } catch (e) {
        console.error(e);
        document.getElementById('products-container').innerHTML = `
          <div class="py-12 text-center text-red-500 text-sm">Failed to load products: ${e.message}</div>`;
      }
    }

    function applyFilters() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const status = document.getElementById('status-filter').value;

      let filtered = allProducts;
      if (status) filtered = filtered.filter(p => p.status === status);
      if (q) filtered = filtered.filter(p =>
        p.title?.toLowerCase().includes(q) ||
        p.suppliers?.company_name?.toLowerCase().includes(q)
      );

      renderProducts(filtered);
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('status-filter').addEventListener('change', applyFilters);

    window.deleteProduct = async function(id, title) {
      if (!confirm(`Delete "${title}"?\nThis cannot be undone.`)) return;
      try {
        const { error } = await supabaseClient.from('products').delete().eq('id', id);
        if (error) throw error;
        showToast('Product deleted');
        loadProducts();
      } catch (e) {
        alert(e.message || 'Failed to delete');
      }
    };

    // Auth
    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', user.id).single();
        const name = profile?.full_name || user.email?.split('@')[0] || 'Admin';
        document.getElementById('admin-name').textContent = name;
        document.getElementById('admin-email').textContent = user.email || '';
        document.getElementById('admin-avatar').textContent = name.charAt(0).toUpperCase();
      }
    }

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      if (!confirm('Logout?')) return;
      await supabaseClient.auth.signOut();
      window.location.href = 'admin-login.html';
    });

    // Init
    checkAuth();
    loadProducts();
  </script>
</body>
</html>
